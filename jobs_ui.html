<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search</title>
<style>
  :root{
    --bg:#f5f4f0;
    --surface:#ffffff;
    --surface-2:#ebe9e3;
    --border:#dcd9d1;
    --text:#1c1b19;
    --text-dim:#66635b;
    --text-faint:#9a968a;
    --accent:#2f6fed;
    --accent-ink:#ffffff;
    --accent-soft:#e6edfc;
    --mark:#ffe08a;
    --shadow: 0 1px 2px rgba(28,27,25,0.06), 0 6px 16px -8px rgba(28,27,25,0.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17181a;
      --surface:#1f2123;
      --surface-2:#26282b;
      --border:#34363a;
      --text:#eceae4;
      --text-dim:#a6a49b;
      --text-faint:#726f66;
      --accent:#6d9bff;
      --accent-ink:#0c1420;
      --accent-soft:#1c2433;
      --mark:#5b4c1c;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px -8px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-inline:16px;
  }
  .wrap{max-width:920px;margin:0 auto;padding-block:20px 60px;}

  .masthead{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-bottom:18px;
  }
  .masthead h1{
    font-size:15px; font-weight:700; letter-spacing:0.02em;
    margin:0; color:var(--text);
  }
  .masthead .source{
    font-size:12px; color:var(--text-dim); margin-top:2px;
  }
  .masthead .source b{color:var(--text); font-weight:600;}

  .loader{
    display:flex; align-items:center; gap:8px;
  }
  .loader label{
    font-size:12.5px; font-weight:600; color:var(--accent-ink);
    background:var(--accent); border-radius:7px; padding:7px 12px; cursor:pointer;
    white-space:nowrap;
  }
  .loader input[type="file"]{display:none;}

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:14px;
    margin-bottom:16px;
    position:sticky;
    top:10px;
    z-index:5;
  }
  .search-row{display:flex; gap:8px; margin-bottom:12px;}
  .search-row input[type="search"]{
    flex:1; min-width:0;
    font:inherit; font-size:14px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--surface-2);
    color:var(--text);
  }
  .search-row input[type="search"]:focus{outline:2px solid var(--accent); outline-offset:-1px;}
  .search-row input[type="search"]::placeholder{color:var(--text-faint);}

  .filters{
    display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center;
    font-size:12.5px; color:var(--text-dim);
  }
  .filters .group{display:flex; align-items:center; gap:6px;}
  .filters label{display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none;}
  .filters input[type="checkbox"]{accent-color:var(--accent); width:14px; height:14px;}
  select{
    font:inherit; font-size:12.5px; color:var(--text);
    background:var(--surface-2); border:1px solid var(--border); border-radius:6px;
    padding:6px 8px;
  }
  .sep{width:1px; align-self:stretch; background:var(--border); min-height:20px;}
  .clear-btn{
    font:inherit; font-size:12.5px; color:var(--text-dim);
    background:none; border:1px solid var(--border); border-radius:6px;
    padding:6px 10px; cursor:pointer;
  }
  .clear-btn:hover{border-color:var(--text-faint); color:var(--text);}

  .list{display:flex; flex-direction:column; gap:10px;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    display:flex; flex-direction:column; gap:6px;
  }
  .card:hover{border-color:var(--accent);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-title{font-size:15px; font-weight:600; line-height:1.35;}
  .card-title a{color:var(--text); text-decoration:none;}
  .card-title a:hover{color:var(--accent); text-decoration:underline;}
  .posted-badge{
    flex-shrink:0; font-size:11px; font-weight:600; letter-spacing:.02em;
    padding:3px 8px; border-radius:100px;
    background:var(--surface-2); color:var(--text-dim); white-space:nowrap;
  }
  .posted-badge.new{background:var(--accent-soft); color:var(--accent);}
  .meta-row{display:flex; flex-wrap:wrap; gap:6px 10px; font-size:12.5px; color:var(--text-dim);}
  .meta-row .dot::before{content:"\00b7"; margin-right:10px; color:var(--text-faint);}
  .tag{font-size:10.5px; color:var(--text-faint); font-family:ui-monospace, Menlo, monospace;}
  .snippet{font-size:13px; color:var(--text-dim); line-height:1.5; margin-top:2px;}
  .snippet mark{background:var(--mark); color:var(--text); border-radius:2px; padding:0 1px;}

  .empty{text-align:center; padding:60px 20px; color:var(--text-faint);}
  .empty .big{font-size:26px; margin-bottom:8px; color:var(--text-dim);}
  .empty .hint{font-size:13px; max-width:420px; margin:0 auto;}
  .empty label{
    display:inline-block; margin-top:16px;
    font-size:13px; font-weight:600; color:var(--accent-ink);
    background:var(--accent); border-radius:8px; padding:10px 18px; cursor:pointer;
  }
  .empty input[type="file"]{display:none;}
  .dropzone.drag{outline:2px dashed var(--accent); outline-offset:-8px; border-radius:10px;}

  .read-more{
    align-self:flex-start;
    font:inherit; font-size:12.5px; font-weight:600;
    color:var(--accent); background:none; border:none; padding:2px 0; cursor:pointer;
  }
  .read-more:hover{text-decoration:underline;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5);
    display:flex; align-items:flex-start; justify-content:center;
    padding:24px 16px; z-index:50; overflow-y:auto;
  }
  .modal{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow); max-width:680px; width:100%; padding:22px 24px; margin-bottom:24px;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px;}
  .modal-head h2{font-size:17px; margin:0; line-height:1.35;}
  .modal-close{
    font:inherit; font-size:13px; color:var(--text-dim);
    background:var(--surface-2); border:1px solid var(--border); border-radius:6px;
    padding:5px 10px; cursor:pointer; flex-shrink:0;
  }
  .modal-close:hover{color:var(--text); border-color:var(--text-faint);}
  .modal-meta{
    display:flex; flex-wrap:wrap; gap:6px 10px; font-size:12.5px; color:var(--text-dim);
    margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border);
  }
  .modal-meta .dot::before{content:"\00b7"; margin-right:10px; color:var(--text-faint);}
  .modal-apply{
    display:inline-block; margin-bottom:14px;
    font-size:13px; font-weight:600; color:var(--accent-ink);
    background:var(--accent); border-radius:7px; padding:8px 14px; text-decoration:none;
  }
  .modal-desc{font-size:13.5px; line-height:1.65; color:var(--text); white-space:pre-wrap; word-wrap:break-word;}
  .modal-desc mark{background:var(--mark); color:var(--text); border-radius:2px; padding:0 1px;}

  [hidden]{display:none !important;}

  @media (max-width:520px){
    .filters{font-size:12px;}
    .card-top{flex-direction:column;}
    .masthead{align-items:flex-start;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <div>
      <h1>Job Search</h1>
      <div class="source" id="source">no file loaded</div>
    </div>
    <div class="loader">
      <label for="fileInputTop">Load JSON<input type="file" id="fileInputTop" accept="application/json,.json"></label>
    </div>
  </div>

  <div class="panel" id="panel" hidden>
    <div class="search-row">
      <input type="search" id="q" placeholder="Search title, location, or description" autocomplete="off">
    </div>
    <div class="filters">
      <div class="group" id="remoteGroup" hidden></div>
      <div class="sep" id="remoteSep" hidden></div>
      <div class="group">
        <label for="posted">Posted within</label>
        <select id="posted">
          <option value="9999">Any time</option>
          <option value="1">24 hours</option>
          <option value="3">3 days</option>
          <option value="7">7 days</option>
          <option value="14">14 days</option>
          <option value="30">30 days</option>
        </select>
      </div>
      <div class="sep"></div>
      <div class="group">
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="recent">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="title">Title A-Z</option>
        </select>
      </div>
      <div class="sep"></div>
      <button class="clear-btn" id="clearBtn">Clear filters</button>
    </div>
  </div>

  <div class="empty dropzone" id="dropzone">
    <div class="big">Load a jobs file</div>
    <div class="hint">Drop a JSON file here, or pick the output from <code>workday_scraper.py</code> (or any array of job objects with a <code>title</code> field).</div>
    <label for="fileInputEmpty">Choose file<input type="file" id="fileInputEmpty" accept="application/json,.json"></label>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="noMatches" hidden>
    <div class="big">No matches</div>
    <div class="hint">Try fewer keywords or clear a filter.</div>
  </div>
</div>

<div class="modal-overlay" id="overlay" hidden></div>

<script>
(function(){
  var state = { jobs: [], remoteTypes: [], activeRemote: new Set() };

  function esc(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function highlight(text, terms){
    if(!terms.length) return esc(text);
    var out = esc(text);
    terms.forEach(function(t){
      if(!t) return;
      var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
      out = out.replace(re, '<mark>$1</mark>');
    });
    return out;
  }

  function snippetAround(desc, terms){
    var lower = desc.toLowerCase();
    var idx = -1;
    for(var i=0;i<terms.length;i++){
      var p = lower.indexOf(terms[i]);
      if(p !== -1){ idx = p; break; }
    }
    var start = idx === -1 ? 0 : Math.max(0, idx - 60);
    var chunk = desc.slice(start, start + 220).trim();
    return (start > 0 ? '…' : '') + chunk + (start + 220 < desc.length ? '…' : '');
  }

  // ---- parsing: accept raw workday_scraper.py output (or any similar list) ----

  function parseDaysAgo(s){
    s = s || '';
    if (/today/i.test(s)) return 0;
    if (/yesterday/i.test(s)) return 1;
    var m = s.match(/(\d+)\+?\s+Days?\s+Ago/i);
    if (m) return parseInt(m[1], 10);
    return null;
  }

  function normalize(raw){
    // raw entries may be full scraper dicts or already-trimmed ones; read
    // whichever fields exist and fall back gracefully.
    return raw.map(function(j){
      var postedOn = j.postedOn || j.posted_on || null;
      var daysAgo = j.daysAgo != null ? j.daysAgo : parseDaysAgo(postedOn);
      var reqId = j.reqId || j.jobReqId || (Array.isArray(j.bulletFields) ? j.bulletFields[0] : null);
      var url = j.url || j.externalUrl || j.externalPath || '';
      return {
        title: j.title || '(untitled)',
        location: j.location_text || j.locationsText || j.location || '',
        remote: j.remote || j.remoteType || '',
        postedOn: postedOn,
        daysAgo: daysAgo,
        reqId: reqId,
        timeType: j.timeType || '',
        url: url,
        desc: j.desc || j.description || ''
      };
    });
  }

  function loadFile(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var data;
      try{
        data = JSON.parse(e.target.result);
      }catch(err){
        alert('Could not parse ' + file.name + ' as JSON: ' + err.message);
        return;
      }
      if(!Array.isArray(data)){
        alert(file.name + ' is not a JSON array of job objects.');
        return;
      }
      document.getElementById('source').innerHTML = '<b>' + esc(file.name) + '</b> · loaded just now';
      init(normalize(data));
    };
    reader.onerror = function(){ alert('Could not read ' + file.name); };
    reader.readAsText(file);
  }

  function openModal(j, terms){
    var overlay = document.getElementById('overlay');
    overlay.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-head">' +
          '<h2>' + highlight(j.title, terms) + '</h2>' +
          '<button class="modal-close" id="modalClose">Close</button>' +
        '</div>' +
        '<div class="modal-meta">' +
          '<span>' + esc(j.location || 'Location TBD') + '</span>' +
          (j.remote ? '<span class="dot">' + esc(j.remote) + '</span>' : '') +
          (j.timeType ? '<span class="dot">' + esc(j.timeType) + '</span>' : '') +
          (j.reqId ? '<span class="dot tag">' + esc(j.reqId) + '</span>' : '') +
          '<span class="dot">' + esc(j.postedOn || '') + '</span>' +
        '</div>' +
        (j.url ? '<a class="modal-apply" href="' + esc(j.url) + '" target="_blank" rel="noopener">Open posting →</a>' : '') +
        '<div class="modal-desc">' + (j.desc ? highlight(j.desc, terms) : '<span style="color:var(--text-faint)">No description available.</span>') + '</div>' +
      '</div>';
    overlay.hidden = false;
    document.getElementById('modalClose').addEventListener('click', closeModal);
    overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });
    document.addEventListener('keydown', escHandler);
  }
  function closeModal(){
    var overlay = document.getElementById('overlay');
    overlay.hidden = true;
    overlay.innerHTML = '';
    document.removeEventListener('keydown', escHandler);
  }
  function escHandler(e){ if(e.key === 'Escape') closeModal(); }

  function render(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var terms = q.split(/\s+/).filter(Boolean);
    var maxDays = parseInt(document.getElementById('posted').value, 10);
    var sortMode = document.getElementById('sort').value;

    var filtered = state.jobs.filter(function(j){
      if(state.activeRemote.size && !state.activeRemote.has(j.remote)) return false;
      if(j.daysAgo != null && j.daysAgo > maxDays) return false;
      if(maxDays < 9999 && j.daysAgo == null) return false;
      if(!terms.length) return true;
      return terms.every(function(t){ return j._hay.indexOf(t) !== -1; });
    });

    filtered.sort(function(a,b){
      if(sortMode === 'title') return a.title.localeCompare(b.title);
      var da = a.daysAgo == null ? 9999 : a.daysAgo;
      var db = b.daysAgo == null ? 9999 : b.daysAgo;
      return sortMode === 'oldest' ? db - da : da - db;
    });

    var list = document.getElementById('list');
    var noMatches = document.getElementById('noMatches');

    if(!filtered.length){
      list.innerHTML = '';
      noMatches.hidden = false;
      return;
    }
    noMatches.hidden = true;

    var frag = document.createDocumentFragment();
    filtered.slice(0, 500).forEach(function(j){
      var card = document.createElement('div');
      card.className = 'card';
      var isNew = j.daysAgo != null && j.daysAgo <= 1;
      var snippet = j.desc ? highlight(snippetAround(j.desc, terms), terms) : '';
      card.innerHTML =
        '<div class="card-top">' +
          '<div class="card-title">' + (j.url ? '<a href="' + esc(j.url) + '" target="_blank" rel="noopener">' + highlight(j.title, terms) + '</a>' : highlight(j.title, terms)) + '</div>' +
          '<div class="posted-badge' + (isNew ? ' new' : '') + '">' + esc(j.postedOn || '—') + '</div>' +
        '</div>' +
        '<div class="meta-row">' +
          '<span>' + highlight(j.location || 'Location TBD', terms) + '</span>' +
          (j.remote ? '<span class="dot">' + esc(j.remote) + '</span>' : '') +
          (j.timeType ? '<span class="dot">' + esc(j.timeType) + '</span>' : '') +
          (j.reqId ? '<span class="dot tag">' + esc(j.reqId) + '</span>' : '') +
        '</div>' +
        (snippet ? '<div class="snippet">' + snippet + '</div>' : '') +
        (j.desc ? '<button class="read-more" type="button">Read full description</button>' : '');
      var btn = card.querySelector('.read-more');
      if(btn) btn.addEventListener('click', function(){ openModal(j, terms); });
      frag.appendChild(card);
    });
    list.innerHTML = '';
    list.appendChild(frag);
  }

  function buildRemoteFilter(){
    var group = document.getElementById('remoteGroup');
    var sep = document.getElementById('remoteSep');
    group.innerHTML = '';
    group.hidden = !state.remoteTypes.length;
    sep.hidden = !state.remoteTypes.length;
    state.remoteTypes.forEach(function(rt){
      var id = 'r_' + rt.replace(/\W+/g,'_');
      var label = document.createElement('label');
      label.innerHTML = '<input type="checkbox" id="' + id + '" value="' + esc(rt) + '"> ' + esc(rt);
      group.appendChild(label);
      label.querySelector('input').addEventListener('change', function(e){
        if(e.target.checked) state.activeRemote.add(rt);
        else state.activeRemote.delete(rt);
        render();
      });
    });
  }

  function init(jobs){
    state.activeRemote = new Set();
    state.remoteTypes = [];
    state.jobs = jobs.filter(function(j){ return j.title; }).map(function(j){
      j._hay = ((j.title||'') + ' ' + (j.location||'') + ' ' + (j.remote||'') + ' ' + (j.desc||'')).toLowerCase();
      return j;
    });
    var seen = {};
    state.jobs.forEach(function(j){ if(j.remote && !seen[j.remote]){ seen[j.remote]=1; state.remoteTypes.push(j.remote); } });
    state.remoteTypes.sort();
    buildRemoteFilter();

    document.getElementById('q').value = '';
    document.getElementById('posted').value = '9999';
    document.getElementById('sort').value = 'recent';

    document.getElementById('dropzone').hidden = true;
    document.getElementById('panel').hidden = false;
    render();
  }

  document.getElementById('q').addEventListener('input', render);
  document.getElementById('posted').addEventListener('change', render);
  document.getElementById('sort').addEventListener('change', render);
  document.getElementById('clearBtn').addEventListener('click', function(){
    document.getElementById('q').value = '';
    document.getElementById('posted').value = '9999';
    document.getElementById('sort').value = 'recent';
    state.activeRemote.clear();
    document.querySelectorAll('#remoteGroup input[type=checkbox]').forEach(function(c){ c.checked = false; });
    render();
  });

  ['fileInputTop', 'fileInputEmpty'].forEach(function(id){
    document.getElementById(id).addEventListener('change', function(e){
      loadFile(e.target.files[0]);
    });
  });

  var dz = document.getElementById('dropzone');
  ['dragenter','dragover'].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove('drag'); });
  });
  dz.addEventListener('drop', function(e){
    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) loadFile(f);
  });

  // optional: ?src=relative/path.json to auto-load when served over http(s)
  var params = new URLSearchParams(location.search);
  var src = params.get('src');
  if(src && location.protocol !== 'file:'){
    fetch(src).then(function(r){ return r.json(); }).then(function(data){
      document.getElementById('source').innerHTML = '<b>' + esc(src) + '</b> · loaded from URL';
      init(normalize(data));
    }).catch(function(){ /* ignore, user can still pick a file */ });
  }
})();
</script>
</body>
</html>
